<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Sailfish's old system Amiri contains a wide U+FDFC glyph and Qt may
       select it directly for native application text. Remove only that one
       codepoint from its advertised coverage; all other system Amiri glyphs
       remain available. -->
  <match target="scan">
    <test name="file" compare="eq">
      <string>/usr/share/fonts/amiri/amiri-regular.ttf</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <int>0xFDFC</int>
        </charset>
      </minus>
    </edit>
  </match>

  <!-- Prefer the Android-shaped U+FDFC family whenever that character is
       requested. -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <int>0xFDFC</int>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FUTO Android Riyal</string>
    </edit>
  </match>
</fontconfig>
