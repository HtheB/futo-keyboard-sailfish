[Unit]
Wants=futo-keyboard-helper.service
After=futo-keyboard-helper.service

[Service]
Environment=LD_PRELOAD=@FUTO_LIBDIR@/libfuto-maliit-policy.so.1
# mapplauncherd intentionally sanitizes LD_PRELOAD before loading the real
# keyboard process.  Maliit is also a normal PIE executable, so run it
# directly to keep this policy isolated to Maliit and preserve Type=dbus.
ExecStart=
ExecStart=/usr/bin/maliit-server
