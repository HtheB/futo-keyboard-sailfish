plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('FUTO_ANDROID_RELEASE_KEYSTORE')
def releasePassword = System.getenv('FUTO_ANDROID_RELEASE_PASSWORD')
android {
    namespace 'org.htheb.futo.autofill'
    compileSdk 35
    defaultConfig {
        applicationId 'org.htheb.futo.autofill'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '0.8.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (releaseKeystore && releasePassword) {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'futo-autofill-release'
                keyPassword releasePassword
            }
        }
    }
    buildTypes {
        release { debuggable false; signingConfig signingConfigs.release }
    }
}
